[project]
name = "ops-backend-simulator"
version = "0.1.0"
description = "Stateful HTTP simulator for ops-agent (parallel to ops-backend Java)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
