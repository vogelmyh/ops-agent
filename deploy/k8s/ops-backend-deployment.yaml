apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-backend
  namespace: ops-agent-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-backend
  template:
    metadata:
      labels:
        app: ops-backend
    spec:
      containers:
        - name: ops-backend
          image: ops-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
