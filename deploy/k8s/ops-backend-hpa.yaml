apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ops-backend
  namespace: ops-agent-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ops-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
