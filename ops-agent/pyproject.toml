[project]
name = "ops-agent"
version = "0.1.0"
description = "Ops diagnosis and remediation agent (LangGraph + FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb",
    "fastapi",
    "httpx",
    "langchain",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langsmith",
    "prometheus-client",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "rank-bm25",
    "redis",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "rag_eval: RAG golden-set offline retrieval evaluation",
    "real_llm_rag: real LLM rubric eval (requires API key)",
]
